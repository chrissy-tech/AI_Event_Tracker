<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event Tracker - Local Discoveries</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎉 Event Tracker AI</h1>
            <p class="subtitle">Discover what's happening in Bitterfeld-Wolfen & Region</p>
        </header>

        <section class="crawl-section">
            <h3>📥 Data Management</h3>
            <p style="font-size: 0.9em; margin-bottom: 10px; color: #666;">
                Click refresh only if you want the AI to scan websites for new events.
            </p>
            <button class="crawl-btn" onclick="triggerCrawl()" id="crawl-btn">
                🔄 Refresh Event List
            </button>
            <span id="crawl-status" style="margin-left: 10px; font-size: 0.9em;"></span>
        </section>

        <section class="search-section">
            <h3>🔍 Find Events</h3>
            <form id="search-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="user-query"
                        placeholder="e.g., What is happening this weekend?"
                        required
                    >
                    <button type="submit" class="search-btn">Ask AI</button>
                </div>

            </form>
        </section>

        <section class="results-section">
            <h3>💬 AI Recommendation:</h3>
            <div id="ai-response-box">
                Hello! Enter a question above to find events.
            </div>
        </section>
    </div>

    <script>
        /**
         * Trigger the Python Crawler to scrape new events.
         */
        async function triggerCrawl() {
            const btn = document.getElementById("crawl-btn");
            const status = document.getElementById("crawl-status");

            btn.disabled = true;
            status.innerHTML = '<span class="loading-text">Crawling websites...</span>';

            try {
                const response = await fetch("/crawl");
                const data = await response.json();
                status.innerHTML = `✅ Successfully found ${data.events_found} events!`;
            } catch (error) {
                status.innerHTML = "❌ Error connecting to server.";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        /**
         * Submit search query and filters to the FastAPI backend.
         */
        document.getElementById("search-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            // 1. Grab values from UI
            const queryText = document.getElementById("user-query").value;
            const responseBox = document.getElementById("ai-response-box");

            // 2. Visual Loading state
            responseBox.innerHTML = '<span class="loading-text">AI is thinking...</span>';

            try {
                // 3. Send POST request to /api
                const response = await fetch("/api", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: queryText
                    })
                });

                const data = await response.json();

                // 4. Update UI with AI answer
                responseBox.innerText = data.reply;

            } catch (error) {
                responseBox.innerHTML =
                    '<span style="color: red;">❌ Search failed. Please try again.</span>';
                console.error("Search error:", error);
            }
        });
    </script>
</body>
</html>
