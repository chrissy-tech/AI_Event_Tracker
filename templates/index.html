<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event Tracker - Local Discoveries</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        /* Database Section */
        .crawl-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
        }

        .crawl-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .crawl-btn:hover {
            background-color: #218838;
        }

        .crawl-btn:disabled {
            background-color: #ccc;
        }

        /* Search Section */
        .search-section {
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #user-query {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        /* NEW: Filters Section */
        .filters-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f1f3f9;
            border-radius: 8px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .search-btn {
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Results Display */
        #ai-response-box {
            margin-top: 25px;
            padding: 20px;
            background: #fafafa;
            border-left: 5px solid #667eea;
            border-radius: 5px;
            line-height: 1.6;
            min-height: 100px;
        }

        .loading-text {
            color: #667eea;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎉 Event Tracker AI</h1>
            <p class="subtitle">Discover what's happening in Bitterfeld-Wolfen & Region</p>
        </header>

        <section class="crawl-section">
            <h3>📥 Data Management</h3>
            <p style="font-size: 0.9em; margin-bottom: 10px; color: #666;">
                Click refresh only if you want the AI to scan websites for new events.
            </p>
            <button class="crawl-btn" onclick="triggerCrawl()" id="crawl-btn">
                🔄 Refresh Event List
            </button>
            <span id="crawl-status" style="margin-left: 10px; font-size: 0.9em;"></span>
        </section>

        <section class="search-section">
            <h3>🔍 Find Events</h3>
            <form id="search-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="user-query"
                        placeholder="e.g., What is happening this weekend?"
                        required
                    >
                    <button type="submit" class="search-btn">Ask AI</button>
                </div>

                <div class="filters-group">
                    <label class="filter-item">
                        <input type="checkbox" id="filter-free"> 💸 Only Free Events
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" id="filter-kids"> 🧸 Child Friendly
                    </label>
                </div>
            </form>
        </section>

        <section class="results-section">
            <h3>💬 AI Recommendation:</h3>
            <div id="ai-response-box">
                Hello! Enter a question above to find events.
            </div>
        </section>
    </div>

    <script>
        /**
         * Trigger the Python Crawler to scrape new events.
         */
        async function triggerCrawl() {
            const btn = document.getElementById("crawl-btn");
            const status = document.getElementById("crawl-status");

            btn.disabled = true;
            status.innerHTML = '<span class="loading-text">Crawling websites...</span>';

            try {
                const response = await fetch("/crawl");
                const data = await response.json();
                status.innerHTML = `✅ Successfully found ${data.events_found} events!`;
            } catch (error) {
                status.innerHTML = "❌ Error connecting to server.";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        /**
         * Submit search query and filters to the FastAPI backend.
         */
        document.getElementById("search-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            // 1. Grab values from UI
            const queryText = document.getElementById("user-query").value;
            const isFreeOnly = document.getElementById("filter-free").checked;
            const isChildFriendly = document.getElementById("filter-kids").checked;
            const responseBox = document.getElementById("ai-response-box");

            // 2. Visual Loading state
            responseBox.innerHTML = '<span class="loading-text">AI is thinking...</span>';

            try {
                // 3. Send POST request to /api
                const response = await fetch("/api", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: queryText,
                        free_only: isFreeOnly,
                        child_friendly: isChildFriendly
                    })
                });

                const data = await response.json();

                // 4. Update UI with AI answer
                responseBox.innerText = data.reply;

            } catch (error) {
                responseBox.innerHTML = '<span style="color: red;">❌ Search failed. Please try again.</span>';
                console.error("Search error:", error);
            }
        });
    </script>
</body>
</html>
